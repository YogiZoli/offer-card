<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offer Card</title>
<meta name="description" content="Build your offer in 12 simple questions. Get a clear Offer Card you can download, plus the GHL build spec for every part of it.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;700&display=swap">
<style>
  /* Shine v3 palette from YogiZoli/design-system, the same as the other "-brand-design" lead magnets.
     Text #0F172A, muted #475569, page #F5F7FA, surface #FFFFFF, border #E2E8F0
     Teal #0E7490 on #E6F4F7, Navy #1E3A8A on #E8EDFB, Emerald #047857 on #E7F6F0
     Amber dark #92400E on #FEF3E2 for errors and warnings. No other colour. */
  :root{
    --text:#0F172A; --muted:#475569; --bg:#F5F7FA; --surface:#FFFFFF; --border:#E2E8F0;
    --teal:#0E7490; --teal-t:#E6F4F7; --navy:#1E3A8A; --navy-t:#E8EDFB; --emerald:#047857; --emerald-t:#E7F6F0;
    --amber:#B45309; --amber-t:#FEF3E2; --amber-d:#92400E;

    --font-sans:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --font-mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
    --text-xs:.8125rem; --text-sm:.9375rem; --text-base:1rem;
    --radius-sm:6px; --radius-md:10px; --radius-lg:12px; --radius-xl:18px; --radius-full:9999px;
    --shadow-xs:0 1px 2px var(--border);
    --shadow-md:0 4px 12px var(--border);
    --duration-fast:120ms; --duration-base:180ms;
    --ease-standard:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(0,0,.2,1); --ease-inout:cubic-bezier(.4,0,.2,1);
    color-scheme:light;
  }
  [data-tone="1"]{--tone:var(--teal);--tone-bg:var(--teal-t)}
  [data-tone="2"]{--tone:var(--navy);--tone-bg:var(--navy-t)}
  [data-tone="3"]{--tone:var(--emerald);--tone-bg:var(--emerald-t)}

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;color:var(--text);
    background:radial-gradient(var(--border) 1px,transparent 1px) 0 0/20px 20px var(--bg);
    font-family:var(--font-sans);font-size:var(--text-base);line-height:1.6;
    padding-inline:16px;padding-block:18px 40px;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  }
  body::before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:var(--teal);z-index:5}
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  header{text-align:center}
  h1,.band h2,.card h3{color:var(--text);text-decoration:underline;text-decoration-color:var(--teal);text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-skip-ink:none}
  h1{margin:0;font-weight:800;letter-spacing:-.016em;line-height:1.3;font-size:clamp(24px,6vw,30px);text-wrap:balance;text-decoration-thickness:4px;text-underline-offset:8px}
  .sub{margin:6px 0 0;font-size:var(--text-sm);font-weight:400;color:var(--muted)}

  .prog{display:flex;flex-direction:column;gap:6px}
  .progtop{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .bar{height:8px;border-radius:var(--radius-full);background:var(--border);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:var(--radius-full);transition:width var(--duration-base) var(--ease-standard)}

  /* every content block: tint plus a 4px left border in the matching strong colour */
  #stage > .card,#stage > .band{position:relative;background:var(--tone-bg);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--tone);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)}
  .band{padding:20px;animation:card-in var(--duration-base) var(--ease-out)}
  @keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .steptag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .steptag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .steptag .n{order:2;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--teal);color:var(--surface);font-size:12px;line-height:1;font-weight:700}
  .band h2{margin:10px 0 0;font-size:clamp(22px,5.6vw,28px);font-weight:800;letter-spacing:-.016em;line-height:1.3;text-wrap:balance}
  .why{margin:10px 0 0;font-size:var(--text-sm);font-weight:400;line-height:1.5;color:var(--muted)}
  .why b{color:var(--text);font-weight:700}

  .card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px}
  .card h3{margin:0;font-size:18px;font-weight:700;line-height:1.4}
  .card p{margin:0}
  .flabel{font-size:var(--text-sm);font-weight:600;margin:0;color:var(--text)}
  .flabel small{font-weight:400;color:var(--muted)}
  .hint{margin:0;font-size:var(--text-sm);font-weight:400;color:var(--muted);line-height:1.5}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .two{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:621px){.two{grid-template-columns:1fr 1fr}}
  input[type=text],input[type=email],textarea{
    width:100%;min-height:48px;border:1px solid var(--muted);background:var(--surface);color:var(--text);border-radius:var(--radius-md);
    padding:12px 16px;font-family:inherit;font-size:16px;font-weight:400;
    transition:border-color var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard);
  }
  input::placeholder,textarea::placeholder{color:var(--muted)}
  textarea{min-height:104px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-t)}

  .opts{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:621px){.opts{grid-template-columns:1fr 1fr}}
  .opt{
    appearance:none;cursor:pointer;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:var(--radius-md);padding:13px 16px;font-family:inherit;font-size:16px;font-weight:600;line-height:1.35;min-height:52px;
    transition:background-color var(--duration-base) var(--ease-standard),border-color var(--duration-base) var(--ease-standard),transform var(--duration-fast) var(--ease-standard);
  }
  .opt:hover{border-color:var(--teal)}
  .opt:active{transform:scale(.98)}
  .opt:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-t);box-shadow:0 0 0 1px var(--teal)}

  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:var(--radius-md);border:1px solid var(--teal);
    background:var(--teal);color:var(--surface);cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;line-height:1.15;text-decoration:none;
    transition:box-shadow var(--duration-base) var(--ease-standard),transform var(--duration-fast) var(--ease-standard)}
  .btn:hover{box-shadow:0 0 0 3px var(--teal-t),0 0 0 4px var(--teal);transform:translateY(-1px)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.ghost:hover{border-color:var(--teal);box-shadow:none;transform:none}
  .btn.small{font-size:var(--text-xs);font-weight:700;padding:8px 14px;min-height:36px}
  .btn.small:hover{transform:none}
  /* the screen's main action: pulsing halo and a light sheen */
  #next,#start{position:relative;overflow:hidden;animation:cta-halo 2.4s var(--ease-out) infinite}
  #next::after,#start::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,var(--surface),transparent);opacity:.35;animation:sheen 3.2s var(--ease-inout) infinite;pointer-events:none}
  @keyframes cta-halo{0%{box-shadow:0 0 0 0 var(--teal)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
  .nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .formerr{color:var(--amber-d);background:var(--amber-t);border:1px solid var(--amber-d);border-radius:var(--radius-lg);padding:10px 14px;font-size:var(--text-sm);font-weight:600;margin:0}
  .kbd{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

  .steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:var(--text-sm);line-height:1.5}
  .steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--teal);color:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:700}
  .linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--teal);font-family:var(--font-mono);font-size:.94em;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .linkbtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* result: hero in solid Teal, then one block per component */
  #stage[data-screen="card"] > .card.hl{background:var(--teal);border:0;color:var(--surface);padding:26px 20px;box-shadow:none}
  .hl .kick{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .hl h3{color:var(--surface)!important;text-decoration-color:var(--surface)!important;font-size:clamp(23px,6vw,30px)!important;font-weight:800!important;letter-spacing:-.016em;line-height:1.3!important}
  .hl .promise{font-size:18px;font-weight:600;line-height:1.45}
  .hl .btn{background:var(--surface);color:var(--teal);border-color:var(--surface)}
  .hl .btn.ghost{background:transparent;color:var(--surface);border-color:var(--surface)}
  .hl .btn:hover{box-shadow:0 0 0 3px var(--surface)}
  .comp{display:flex;flex-direction:column;gap:8px}
  .comphead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .comphead .steptag{color:var(--text)}
  .ans{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;font-size:var(--text-sm);line-height:1.55}
  .ans .lab{display:block;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ans + .ans{margin-top:0}
  .ans ul{margin:4px 0 0;padding-left:20px}
  .ans.empty{color:var(--muted);font-style:italic}
  .ghl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:var(--text-sm);line-height:1.5;padding:10px 12px;border-radius:var(--radius-md);background:var(--surface);border:1px dashed var(--tone)}
  .ghl .tag{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tone);color:var(--surface);border-radius:var(--radius-full);padding:2px 9px;white-space:nowrap}
  .ghl b{display:block}
  .out{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;max-height:340px;overflow:auto;color:var(--text)}
  #pdfBtn{animation:cta-halo-light 2.4s var(--ease-out) infinite}
  @keyframes cta-halo-light{0%{box-shadow:0 0 0 0 var(--surface)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .hl .formerr{margin-top:4px}

  footer{color:var(--muted);font-size:var(--text-xs);line-height:1.55;text-align:center}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Offer Card</h1>
    <p class="sub">Build your offer in 12 simple questions</p>
  </header>
  <div class="prog" id="prog">
    <div class="progtop"><span id="progL"></span><span id="progR"></span></div>
    <div class="bar"><i id="progBar" style="width:0%"></i></div>
  </div>
  <noscript><div class="card"><h3>This tool needs JavaScript</h3><p class="hint">Switch JavaScript on in your browser settings and reload the page.</p></div></noscript>
  <main id="stage" class="wrap"></main>
  <footer>Everything runs in your browser. Your answers are saved on this device only. <span id="ver"></span></footer>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script>
/* ===== SETTINGS ===== */
var WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/em19nP6nAqQD6gDdDDJ9/webhook-trigger/84b83900-3923-4c28-8c0f-650180f96bb9";   // GHL Inbound Webhook: creates the contact and adds the tag lead-magnet-offer-card. Affiliates paste their own. Empty = no POST, the card is still shown.
/* ==================== */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var VERSION = "0.4.0";
  var STORE_KEY = "offer_card_state";

  /* The 12 components. Keys match the JSON schema v1 (offer.*). Each screen says why it asks. */
  var FORMATS = [["Online course","Online course"],["Group coaching","Group coaching"],["1:1 coaching","1:1 coaching"],["Membership","Membership"],["Workshop or challenge","Workshop or challenge"],["Done with you","Done with you"]];
  var QUESTIONS = [
    { id:"who", tag:"Who it's for", title:"Let's start simple. Who is this offer for?",
      why:"A clear person makes every other answer easier. If you try to help everyone, you help no one.",
      fields:[
        { key:"who_for", label:"Describe the one person you most want to help, in one sentence.", ph:"New coaches who want their first 10 paying clients", area:true, req:true },
        { key:"problem", label:"What problem keeps them stuck right now?", ph:"They post every day, but nobody books a call", area:true },
        { key:"not_for", label:"Who is this NOT for?", ph:"People looking for a quick trick with no work", hint:"Optional, but it builds trust." }
      ],
      ghl:["Tags and Smart Lists","Tag every buyer and lead with one clear audience tag, so you can talk to this person again later."] },
    { id:"promise", tag:"Big Promise", title:"Now the big one. If they do everything you ask, what result will they get, and how fast?",
      why:"This is the reason they say yes. Everything else in your offer supports this one sentence.",
      fields:[
        { key:"promise_result", label:"The result they get", ph:"A simple system that brings in new clients every week", area:true, req:true },
        { key:"promise_timeframe", label:"How fast?", ph:"In 6 weeks", req:true, hint:"Only write a time you can stand behind." }
      ],
      ghl:["Sales page headline","Becomes the offer_promise custom value, shown in the headline of your sales page."] },
    { id:"evenif", tag:"The \"even if\"", title:"Here's the thing. Your person already has a reason why this won't work for them. What is it?",
      why:"We'll finish your promise with \"even if...\". When you name their doubt before they do, they trust you more.",
      fields:[ { key:"even_if", label:"Even if...", ph:"you have a small audience and no tech skills", req:true } ],
      ghl:["Sales page sub-headline","Sits right under the headline and answers the first objection."] },
    { id:"name", tag:"Name", title:"What do you call it?",
      why:"A name turns an idea into a real thing people can buy. Pick one people can remember and say out loud.",
      fields:[
        { key:"name", label:"Offer name", ph:"Client Engine", req:true },
        { key:"subtitle", label:"Short subtitle", ph:"The 6-step system for your first 10 clients", hint:"Optional." }
      ],
      ghl:["Product name","Becomes the GHL Product and the offer_name custom value used on pages and in emails."] },
    { id:"format", tag:"Format and Duration", title:"What shape does it take, and how long does it run?",
      why:"Format tells people what their week will look like inside your offer.",
      choice:{ key:"format", opts:FORMATS, other:true },
      fields:[ { key:"duration", label:"How long does it run?", ph:"6 weeks, then lifetime access to the lessons", req:true } ],
      ghl:["Memberships","Create a Course product in Memberships. Its access settings follow this length."] },
    { id:"teaching", tag:"Teaching", title:"What will you teach?",
      why:"Steps make the promise believable. People buy a clear path, not a pile of content.",
      fields:[ { key:"teaching", label:"List the main steps or modules, in order. One per line.", ph:"Find your one person\nWrite your offer\nGet your first calls", area:true, req:true, list:true } ],
      ghl:["Memberships categories and lessons","Each line becomes one category in your Course, with its lessons inside."] },
    /* Interaction is group only: no booking calendar, no 1:1 calls. The default is no live sessions. */
    { id:"interaction", tag:"Interaction", title:"Will you meet your group live?",
      why:"Live time with the group is a strong extra, but it is optional. Only pick what you will really keep doing. There are no 1:1 calls to book.",
      choice:{ key:"interaction", opts:[["No live sessions","No live sessions"],["Weekly live Q&A webinar","Weekly live Q&A webinar"],["Biweekly live Q&A webinar","Live Q&A webinar every two weeks"]] },
      fields:[],
      ghl:["Community live sessions","No booking calendar. If you run a live Q&A, post the webinar link as a recurring event inside your Community group."] },
    { id:"community", tag:"Community", title:"Will they have a place to meet each other?",
      why:"People stay longer when they are not alone.",
      fields:[ { key:"community", label:"Where, and what happens there? Write \"none\" if there is no community.", ph:"A private group to share wins and ask questions", area:true, req:true } ],
      ghl:["Communities","Create a GHL Community group and give buyers access automatically."] },
    { id:"support", tag:"Support", title:"When they get stuck, how do they get help?",
      why:"Support answers the quiet question: \"What if I can't do this alone?\"",
      fields:[ { key:"support", label:"Email, chat, office hours?", ph:"Email and chat support on weekdays", area:true, req:true } ],
      ghl:["Conversations","Every support message lands in one inbox: email, chat and SMS together."] },
    { id:"bonuses", tag:"Bonuses and Extras", title:"What extras do they get?",
      why:"Good bonuses solve the next problem your person will hit.",
      fields:[ { key:"bonuses", label:"Templates, checklists, recordings? One per line.", ph:"Ready-to-use message templates\nClient onboarding checklist", area:true, list:true, hint:"Optional. Leave it empty if there are none." } ],
      ghl:["Memberships bonus content","Add each bonus as an extra lesson or a separate offer in Memberships."] },
    { id:"price", tag:"Price and Reason to Act Now", title:"What does it cost, and why should they join now?",
      why:"A real reason to act now is fair. It helps people decide instead of waiting forever.",
      fields:[
        { key:"price", label:"Price", ph:"$497", req:true },
        { key:"payment_plan", label:"Payment plan", ph:"3 payments of $177", hint:"Optional." },
        { key:"act_now_reason", label:"Why join now and not later?", ph:"The founding price closes when the cart closes", area:true, req:true }
      ],
      ghl:["Payments and order form","Create the Product with its Prices, put the order form on the sales page, and use the cart close date for the deadline."] },
    { id:"risk", tag:"Risk Reversal", title:"Last question. What happens if it doesn't work for them?",
      why:"Your guarantee is how you take the risk off their shoulders. When you carry the risk, saying yes feels safe.",
      fields:[ { key:"risk_reversal", label:"Your guarantee", ph:"Do the work for 30 days. If you are not happy, ask for a full refund.", area:true, req:true } ],
      ghl:["Order form and refunds","Show the guarantee next to the order form. Refunds are handled in Payments."] }
  ];
  var KEYS = ["name","subtitle","who_for","problem","not_for","promise_result","promise_timeframe","even_if","format","duration","teaching","interaction","community","support","bonuses","price","payment_plan","act_now_reason","risk_reversal"];
  var SCREENS = ["intro"].concat(QUESTIONS.map(function(q){ return q.id; }), ["email", "card"]);
  var Q_FIRST = 1, EMAIL_I = SCREENS.length - 2, CARD_I = SCREENS.length - 1;
  var SOURCE = "offer-card";

  var S = { i:0, a:{}, lead:null, leadState:null };
  var storageOK = true;

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function clean(s){ return String(s || "").replace(/\s+/g, " ").trim(); }
  function lines(s){ return String(s || "").split(/\n+/).map(function(l){ return clean(l).replace(/^[-*\d.)\s]+/, ""); }).filter(Boolean); }

  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ storageOK = false; } }
  var saveT; function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY); if(!raw) return;
      var d = JSON.parse(raw);
      if(d && typeof d === "object"){ S.i = +d.i || 0; S.a = d.a && typeof d.a === "object" ? d.a : {}; S.lead = d.lead || null; S.leadState = d.leadState || null; }
    }catch(e){ storageOK = false; }
  }
  function firstMissing(){
    for(var i = 0; i < QUESTIONS.length; i++){ if(missing(QUESTIONS[i])) return i; }
    return -1;
  }
  function missing(q){
    var a = S.a;
    if(q.choice && !clean(a[q.choice.key])) return "Pick one, or type your own.";
    for(var j = 0; j < q.fields.length; j++){ if(q.fields[j].req && !clean(a[q.fields[j].key])) return "Type a short answer to continue."; }
    return "";
  }

  /* ---------- the stable JSON (schema v1) ---------- */
  function offerData(){
    var a = S.a, o = {};
    KEYS.forEach(function(k){ o[k] = k === "teaching" || k === "bonuses" ? lines(a[k]) : clean(a[k]); });
    return o;
  }
  function promiseText(o){
    var t = o.promise_result.replace(/[.\s]+$/, "");
    if(o.promise_timeframe) t += ", " + o.promise_timeframe.replace(/^./, function(c){ return c.toLowerCase(); }).replace(/[.\s]+$/, "");
    return t + ", even if " + o.even_if.replace(/^even if\s*/i, "").replace(/[.\s]+$/, "") + ".";
  }
  function priceText(o){ return o.price + (o.payment_plan ? " or " + o.payment_plan : ""); }

  /* ---------- Launch Engine export: stable JSON (schema v1) plus clean Markdown ---------- */
  var MD_LABELS = { who_for:"Who it is for", problem:"The problem", not_for:"Who it is not for", promise_result:"Result", promise_timeframe:"Timeframe", even_if:"Even if",
    name:"Name", subtitle:"Subtitle", format:"Format", duration:"Duration", teaching:"Steps or modules", interaction:"Live interaction", community:"Community", support:"Support",
    bonuses:"Bonuses", price:"Price", payment_plan:"Payment plan", act_now_reason:"Reason to act now", risk_reversal:"Guarantee" };
  function exportJson(){
    var o = offerData();
    return { schema:"offer-card", version:1, created_at:new Date().toISOString(), offer:o,
      launch_engine:{ offer_name:o.name, offer_promise:promiseText(o), offer_price_display:priceText(o) } };
  }
  function markdown(){
    var o = offerData(), md = ["# Offer Card: " + o.name, ""];
    if(o.subtitle) md.push(o.subtitle, "");
    md.push("**Promise:** " + promiseText(o), "", "**Price:** " + priceText(o), "");
    QUESTIONS.forEach(function(q, i){
      md.push("## " + (i + 1) + ". " + q.tag.replace(/"/g, ""));
      var keys = (q.choice ? [q.choice.key] : []).concat(q.fields.map(function(f){ return f.key; }));
      keys.forEach(function(k){
        var v = o[k];
        if(Array.isArray(v)){ if(v.length){ md.push("- **" + MD_LABELS[k] + ":**"); v.forEach(function(x, j){ md.push("    " + (k === "teaching" ? (j + 1) + ". " : "- ") + x); }); } }
        else if(v) md.push("- **" + MD_LABELS[k] + ":** " + v);
      });
      md.push("- **In GHL:** " + q.ghl[0] + ". " + q.ghl[1], "");
    });
    return md.join("\n").trim() + "\n";
  }
  function launchEngineText(){ return markdown() + "\n```json\n" + JSON.stringify(exportJson(), null, 2) + "\n```\n"; }

  function copyText(text, btn){
    var label = btn.textContent;
    function flash(t){ btn.textContent = t; setTimeout(function(){ btn.textContent = label; }, 1600); }
    function fallback(){
      var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      var ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(t); flash(ok ? "Copied" : "Select and copy by hand");
    }
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ flash("Copied"); }, fallback); else fallback(); }catch(e){ fallback(); }
  }
  function download(name, blob){
    var u = URL.createObjectURL(blob), l = document.createElement("a");
    l.href = u; l.download = name; document.body.appendChild(l); l.click(); document.body.removeChild(l);
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
  }
  function fileBase(){ return "offer-card-" + (clean(S.a.name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "my-offer"); }

  /* ---------- PDF: real text, no AI, built from the answers. Shine palette, three tones. ---------- */
  function latin(s){ return String(s || "").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/…/g, "...").replace(/[^\x20-\x7E\xA0-\xFF\n]/g, ""); }
  function makePdf(){
    var J = window.jspdf && window.jspdf.jsPDF;
    if(!J) throw new Error("PDF library missing");
    var o = offerData(), doc = new J({ unit:"pt", format:"a4" });
    var W = 595, H = 842, M = 48, CW = W - M * 2, y;
    var C = { text:[15,23,42], muted:[71,85,105], border:[226,232,240], white:[255,255,255], teal:[14,116,144], tones:[[[14,116,144],[230,244,247]],[[30,58,138],[232,237,251]],[[4,120,87],[231,246,240]]] };
    function col(c, kind){ if(kind === "fill") doc.setFillColor(c[0], c[1], c[2]); else if(kind === "draw") doc.setDrawColor(c[0], c[1], c[2]); else doc.setTextColor(c[0], c[1], c[2]); }
    function wrap(t, size, w){ doc.setFontSize(size); return doc.splitTextToSize(latin(t), w); }
    function footer(){ doc.setFont("helvetica", "normal"); doc.setFontSize(8); col(C.muted); doc.text("Offer Card  |  " + latin(o.name) + "  |  page " + doc.internal.getNumberOfPages(), M, H - 24); }
    function newPage(){ footer(); doc.addPage(); y = M; }

    /* hero */
    col(C.teal, "fill"); doc.rect(0, 0, W, 210, "F");
    col(C.white); doc.setFont("courier", "bold"); doc.setFontSize(10); doc.text("YOUR OFFER CARD", M, 56);
    doc.setFont("helvetica", "bold"); var tl = wrap(o.name, 30, CW); doc.text(tl, M, 92); y = 92 + tl.length * 32;
    doc.setFont("helvetica", "normal");
    if(o.subtitle){ var sl = wrap(o.subtitle, 12, CW); doc.text(sl, M, y - 8); y += sl.length * 15; }
    doc.setFont("helvetica", "bold"); var pl = wrap(promiseText(o), 14, CW); doc.text(pl, M, y); y += pl.length * 18;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text(latin(o.format + ", " + o.duration + ".  " + priceText(o)), M, Math.min(y + 4, 200));
    y = 240;
    col(C.muted); doc.setFontSize(10);
    var il = wrap("Each part of your offer below, with what to build for it in GHL. This card is also your build spec.", 10, CW); doc.text(il, M, y); y += il.length * 13 + 14;

    /* one block per component */
    QUESTIONS.forEach(function(q, i){
      var tone = C.tones[i % 3], rows = [];
      var keys = (q.choice ? [q.choice.key] : []).concat(q.fields.map(function(f){ return f.key; }));
      keys.forEach(function(k){
        var v = o[k];
        if(Array.isArray(v)){ if(v.length) rows.push([MD_LABELS[k], v.map(function(x, j){ return (k === "teaching" ? (j + 1) + ". " : "- ") + x; }).join("\n")]); }
        else if(v) rows.push([MD_LABELS[k], v]);
      });
      var IW = CW - 28, h = 34, laid = rows.map(function(r){ var l = wrap(r[1], 10.5, IW); h += 14 + l.length * 13.5 + 6; return l; });
      var gl = wrap(q.ghl[0] + ": " + q.ghl[1], 9.5, IW - 60); h += gl.length * 12.5 + 18;
      if(y + h > H - 50) newPage();
      col(tone[1], "fill"); doc.roundedRect(M, y, CW, h, 6, 6, "F");
      col(tone[0], "fill"); doc.rect(M, y, 4, h, "F");
      var yy = y + 22;
      col(tone[0]); doc.setFont("courier", "bold"); doc.setFontSize(10); doc.text((i + 1) + "  " + latin(q.tag).toUpperCase(), M + 16, yy); yy += 12;
      rows.forEach(function(r, j){
        yy += 10; col(C.muted); doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.text(latin(r[0]).toUpperCase(), M + 16, yy);
        yy += 13; col(C.text); doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.text(laid[j], M + 16, yy); yy += (laid[j].length - 1) * 13.5 + 6;
      });
      yy += 8; col(C.white, "fill"); col(tone[0], "draw"); doc.setLineDashPattern([3, 2], 0); doc.roundedRect(M + 12, yy, CW - 24, gl.length * 12.5 + 10, 4, 4, "FD"); doc.setLineDashPattern([], 0);
      col(tone[0]); doc.setFont("courier", "bold"); doc.setFontSize(8.5); doc.text("IN GHL", M + 20, yy + 14);
      col(C.text); doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.text(gl, M + 76, yy + 14);
      y += h + 12;
    });
    footer();
    return doc.output("blob");
  }

  /* ---------- email gate: one POST to the GHL Inbound Webhook. The delivery email comes from the Lead Magnet Machine, not from here. ---------- */
  function leadPayload(){ return { name:S.lead.name, email:S.lead.email, source:SOURCE, offer_name:clean(S.a.name) }; }
  function sendLead(){
    if(!WEBHOOK_URL || !S.lead) return;
    var p = leadPayload();
    S.leadState = { status:"pending", tries:(S.leadState ? S.leadState.tries : 0) + 1 }; save();
    function mark(status){ if(S.leadState){ S.leadState.status = status; save(); } }
    try{
      fetch(WEBHOOK_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(p), keepalive:true })
        .then(function(r){ if(!r.ok) throw new Error("status " + r.status); mark("sent"); })
        .catch(function(){
          /* If the browser blocks the JSON request (CORS), resend as a plain form post. */
          var flat = new URLSearchParams();
          Object.keys(p).forEach(function(k){ flat.append(k, p[k]); });
          return fetch(WEBHOOK_URL, { method:"POST", mode:"no-cors", body:flat, keepalive:true }).then(function(){ mark("sent-unconfirmed"); });
        })
        .catch(function(){ mark("failed"); });
    }catch(e){ mark("failed"); }
  }
  /* a lead that did not go out last time gets another try on the next visit */
  function retryLead(){
    if(WEBHOOK_URL && S.lead && S.leadState && (S.leadState.status === "pending" || S.leadState.status === "failed") && S.leadState.tries < 5) sendLead();
  }

  /* ---------- screens ---------- */
  var stage = $("stage");
  function go(i, fromHistory){
    S.i = Math.max(0, Math.min(SCREENS.length - 1, i)); save();
    render();
    if(!fromHistory){ try{ history.pushState({ i:S.i }, ""); }catch(e){} }
    window.scrollTo(0, 0);
    var h = $("qh"); if(h) h.focus({ preventScroll:true });
  }
  function paint(){
    stage.setAttribute("data-screen", SCREENS[S.i] || "");
    var n = 0;
    Array.prototype.forEach.call(stage.children, function(el){
      if(el.classList && (el.classList.contains("card") || el.classList.contains("band")) && !el.classList.contains("hl")) el.setAttribute("data-tone", String(n++ % 3 + 1));
    });
  }
  function band(tag, n, h, why){
    return "<section class='band'><span class='steptag'><span class='n'>" + n + "</span> " + esc(tag) + "</span><h2 id='qh' tabindex='-1'>" + esc(h) + "</h2>" + (why ? "<p class='why'><b>Why I ask:</b> " + esc(why) + "</p>" : "") + "</section>";
  }
  function navHtml(nextLabel){
    return "<div class='nav'>" + (S.i > 0 ? "<button type='button' class='btn ghost' id='back'>Back</button>" : "<span></span>") +
      (nextLabel ? "<button type='button' class='btn' id='next'>" + esc(nextLabel) + "</button>" : "") + "</div>";
  }
  function bindNav(onNext){
    var b = $("back"), n = $("next");
    if(b) b.addEventListener("click", function(){ go(S.i - 1); });
    if(n) n.addEventListener("click", function(){ if(onNext && onNext() === false) return; go(S.i + 1); });
  }
  function progress(){
    var L, R, pct;
    if(S.i === 0){ L = "Offer Card"; R = "12 questions"; pct = 0; }
    else if(S.i === EMAIL_I){ L = "Almost there"; R = ""; pct = 100; }
    else if(S.i < CARD_I){ L = QUESTIONS[S.i - Q_FIRST].tag; R = "Question " + S.i + " of " + QUESTIONS.length; pct = (S.i - 1) / QUESTIONS.length * 100; }
    else { L = "Your Offer Card"; R = "Done"; pct = 100; }
    $("progL").textContent = L; $("progR").textContent = R; $("progBar").style.width = Math.max(3, pct) + "%";
  }

  function render(){
    try{ draw(); paint(); }
    catch(e){
      stage.innerHTML = "<div class='card'><h3>This screen did not load</h3><p class='hint'>" + (storageOK ? "Your answers are still saved in this browser. " : "") + "Reload the page. If it happens again, go back to the first question.</p><div class='nav'><button type='button' class='btn' id='crReload'>Reload the page</button><button type='button' class='btn ghost' id='crFirst'>First question</button></div></div>";
      $("crReload").addEventListener("click", function(){ location.reload(); });
      $("crFirst").addEventListener("click", function(){ go(Q_FIRST); });
    }
  }
  function draw(){
    /* the card needs every required answer: if one is missing, go to it instead of showing a broken card */
    if(S.i >= EMAIL_I){ var miss = firstMissing(); if(miss >= 0) S.i = Q_FIRST + miss; }
    if(S.i === CARD_I && !S.lead) S.i = EMAIL_I;
    progress();
    var id = SCREENS[S.i];
    if(id === "intro") return intro();
    if(id === "email") return emailGate();
    if(id === "card") return card();
    return question(QUESTIONS[S.i - Q_FIRST]);
  }

  function intro(){
    var started = KEYS.some(function(k){ return clean(S.a[k]); });
    stage.innerHTML = band("Before we start", "12", "Let's build your offer, one question at a time.", "") +
      "<div class='card'><p>You will answer 12 short questions about your offer: who it is for, what they get, the price and your guarantee.</p>" +
      "<ol class='steps'><li><span>One question per screen. Each one tells you why it matters.</span></li><li><span>Short answers are fine. You can go back and change anything.</span></li><li><span>At the end you get your Offer Card, plus what to build for each part in GHL.</span></li></ol>" +
      "<div class='nav'><span></span><button type='button' class='btn' id='start'>" + (started ? "Continue where I left off" : "Start") + "</button></div></div>";
    $("start").addEventListener("click", function(){
      if(!started) return go(Q_FIRST);
      var miss = firstMissing(); go(miss < 0 ? CARD_I : Q_FIRST + miss);
    });
  }

  function question(q){
    var a = S.a, n = S.i - Q_FIRST + 1, body = "";
    if(q.choice && !q.choice.other && !a[q.choice.key]) a[q.choice.key] = q.choice.opts[0][0];   /* default: the first option */
    if(q.choice){
      var cur = a[q.choice.key] || "", known = q.choice.opts.some(function(o){ return o[0] === cur; });
      body += "<div class='opts'>" + q.choice.opts.map(function(o){ return "<button type='button' class='opt' data-v='" + esc(o[0]) + "' aria-pressed='" + (cur === o[0]) + "'>" + esc(o[1]) + "</button>"; }).join("") +
        (q.choice.other ? "<button type='button' class='opt' data-v='' id='otherOpt' aria-pressed='" + (!!cur && !known) + "'>Something else</button></div>" +
        "<div class='field' id='otherWrap'" + (cur && !known ? "" : " hidden") + "><label class='flabel' for='f_other'>Describe the format</label><input id='f_other' type='text' maxlength='120' value='" + esc(known ? "" : cur) + "' autocomplete='off'></div>" : "</div>");
    }
    body += q.fields.map(function(f){
      var label = esc(f.label) + (f.req ? "" : " <small>(optional)</small>");
      var ctl = f.area ? "<textarea id='f_" + f.key + "' maxlength='800' placeholder='" + esc(f.ph) + "'>" + esc(a[f.key] || "") + "</textarea>"
        : "<input id='f_" + f.key + "' type='text' maxlength='200' placeholder='" + esc(f.ph) + "' value='" + esc(a[f.key] || "") + "' autocomplete='off'>";
      return "<div class='field'><label class='flabel' for='f_" + f.key + "'>" + label + "</label>" + ctl + (f.hint ? "<p class='hint'>" + esc(f.hint) + "</p>" : "") + "</div>";
    }).join("");
    var last = S.i === EMAIL_I - 1;
    stage.innerHTML = band(q.tag, n, q.title, q.why) + "<div class='card'>" + body + "<p class='formerr' id='err' role='alert' hidden></p>" + navHtml(last ? "Show my Offer Card" : "Next") + "</div>";

    function collect(){
      q.fields.forEach(function(f){ var el = $("f_" + f.key); if(el) a[f.key] = el.value; });
      var o = $("f_other"); if(o && !$("otherWrap").hidden) a[q.choice.key] = o.value;      saveSoon();
    }
    function valid(){
      var err = missing(q);
      $("err").textContent = err; $("err").hidden = !err;
      return !err;
    }
    Array.prototype.forEach.call(stage.querySelectorAll("input,textarea"), function(el){
      el.addEventListener("input", collect);
      if(el.tagName === "INPUT") el.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); collect(); if(valid()) go(S.i + 1); } });
    });
    Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(stage.querySelectorAll(".opt"), function(x){ x.setAttribute("aria-pressed", String(x === b)); });
        var other = b.id === "otherOpt";
        if($("otherWrap")) $("otherWrap").hidden = !other;
        a[q.choice.key] = other ? $("f_other").value : b.dataset.v;
        save();
        var f = other ? $("f_other") : (q.fields[0] && $("f_" + q.fields[0].key));
        if(f) f.focus();
      });
    });
    bindNav(function(){ collect(); return valid(); });
    var first = stage.querySelector("input[type=text],textarea");
    if(first && !q.choice && window.matchMedia && window.matchMedia("(min-width:700px)").matches) first.focus();
  }

  function emailGate(){
    var l = S.lead || { name:"", email:"" };
    stage.innerHTML = band("Last step", "12", "Your Offer Card is ready", "Tell me where to send it. You also see it on the next screen right away, and you can download it as a PDF.") +
      "<form class='card' id='leadForm' novalidate><div class='two'>" +
      "<div class='field'><label class='flabel' for='leadName'>First name</label><input id='leadName' type='text' autocomplete='given-name' maxlength='60' value='" + esc(l.name) + "'></div>" +
      "<div class='field'><label class='flabel' for='leadEmail'>Email</label><input id='leadEmail' type='email' autocomplete='email' inputmode='email' maxlength='120' value='" + esc(l.email) + "'></div></div>" +
      "<p class='formerr' id='formErr' role='alert' hidden></p>" +
      "<p class='hint'>No spam. You can leave the list with one click at any time.</p>" +
      "<div class='nav'><button type='button' class='btn ghost' id='back'>Back</button><button class='btn' type='submit' id='next'>Show my Offer Card</button></div></form>";
    $("back").addEventListener("click", function(){ go(S.i - 1); });
    $("leadForm").addEventListener("submit", function(ev){
      ev.preventDefault();
      var name = clean($("leadName").value), email = clean($("leadEmail").value), err = $("formErr"), problem = "";
      if(!name) problem = "Enter your first name.";
      else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) problem = "Enter a valid email address, like name@example.com.";
      if(problem){ err.textContent = problem; err.hidden = false; (name ? $("leadEmail") : $("leadName")).focus(); return; }
      var fresh = !S.lead || S.lead.email !== email;
      S.lead = { name:name, email:email };
      if(fresh){ S.leadState = null; sendLead(); }
      go(CARD_I);
    });
  }

  /* ---------- result ---------- */
  function ansHtml(label, val, isList){
    if(isList){
      if(!val.length) return "<div class='ans empty'><span class='lab'>" + esc(label) + "</span>None</div>";
      return "<div class='ans'><span class='lab'>" + esc(label) + "</span><ul>" + val.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    }
    if(!val) return "";
    return "<div class='ans'><span class='lab'>" + esc(label) + "</span>" + esc(val) + "</div>";
  }
  function card(){
    var o = offerData();
    var html = "<div class='card hl'><span class='kick'>Your Offer Card</span><h3 id='qh' tabindex='-1'>" + esc(o.name) + "</h3>" +
      (o.subtitle ? "<p>" + esc(o.subtitle) + "</p>" : "") +
      "<p class='promise'>" + esc(promiseText(o)) + "</p>" +
      "<p>" + esc(o.format) + ", " + esc(o.duration) + ". " + esc(priceText(o)) + ".</p>" +
      "<div class='nav'><button type='button' class='btn' id='pdfBtn'>Download my Offer Card (PDF)</button><button type='button' class='btn ghost small' id='editAll'>Change an answer</button></div>" +
      "<p class='formerr' id='pdfErr' role='alert' hidden></p></div>";
    QUESTIONS.forEach(function(q, i){
      var parts = q.fields.map(function(f){ return ansHtml(f.label.replace(/[?.].*$/, function(m){ return m.charAt(0) === "?" ? "?" : ""; }), o[f.key], f.list); });
      if(q.choice) parts.unshift(ansHtml("Format", o.format));
      html += "<section class='card comp'><div class='comphead'><span class='steptag'><span class='n'>" + (i + 1) + "</span> " + esc(q.tag) + "</span>" +
        "<button type='button' class='linkbtn' data-edit='" + (Q_FIRST + i) + "'>Edit</button></div>" + parts.join("") +
        "<div class='ghl'><span class='tag'>In GHL</span><span><b>" + esc(q.ghl[0]) + "</b>" + esc(q.ghl[1]) + "</span></div></section>";
    });
    var le = launchEngineText();
    html += "<div class='card'><h3>Copy for Launch Engine</h3><p class='hint'>Your answers as clean Markdown plus JSON with stable keys. Paste it where the Launch Brief asks for your Offer Card, and the Sales Page Generator writes your sales page from it.</p>" +
      "<div class='nav'><button type='button' class='btn' id='cpLE'>Copy for Launch Engine</button><button type='button' class='btn ghost small' id='cpMD'>Copy Markdown only</button><button type='button' class='btn ghost small' id='cpJSON'>Copy JSON only</button><button type='button' class='btn ghost small' id='dlMD'>Download .md</button></div>" +
      "<pre class='out' id='leOut'>" + esc(le) + "</pre></div>";
    html += "<div class='card'><div class='nav'><button type='button' class='btn ghost' id='back'>Back</button><button type='button' class='btn ghost small' id='restart'>Start a new Offer Card</button></div></div>";
    stage.innerHTML = html;
    $("cpLE").addEventListener("click", function(){ copyText(launchEngineText(), this); });
    $("cpMD").addEventListener("click", function(){ copyText(markdown(), this); });
    $("cpJSON").addEventListener("click", function(){ copyText(JSON.stringify(exportJson(), null, 2), this); });
    $("dlMD").addEventListener("click", function(){ download(fileBase() + ".md", new Blob([launchEngineText()], { type:"text/markdown" })); });
    $("pdfBtn").addEventListener("click", function(){
      var err = $("pdfErr");
      try{ download(fileBase() + ".pdf", makePdf()); err.hidden = true; }
      catch(e){ err.textContent = "The PDF did not build. Reload the page and try again. Your answers are safe."; err.hidden = false; }
    });
    Array.prototype.forEach.call(stage.querySelectorAll("[data-edit]"), function(b){ b.addEventListener("click", function(){ go(+b.dataset.edit); }); });
    $("editAll").addEventListener("click", function(){ go(Q_FIRST); });
    $("back").addEventListener("click", function(){ go(S.i - 1); });
    $("restart").addEventListener("click", function(){
      if(!confirm("Start a new Offer Card? Your current answers in this browser will be replaced.")) return;
      S.a = {}; go(0);   /* the lead stays: a returning visitor does not fill the gate twice */
    });
  }

  /* ---------- start ---------- */
  $("ver").textContent = "v" + VERSION;
  load();
  retryLead();
  window.addEventListener("popstate", function(e){ if(e.state && typeof e.state.i === "number") go(e.state.i, true); });
  try{ history.replaceState({ i:S.i }, ""); }catch(e){}
  render();
  window.OfferCard = { data:offerData, json:exportJson, markdown:markdown, pdf:makePdf };
})();
</script>
</body>
</html>
